<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="manifest.open_in_tab" content="true" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JushoAI 設定</title>
    <style>
      :root { color-scheme: light dark; --line: #c8ccd4; --accent: #2457d6; --bg: #fff; --fg: #1a1a1a; }
      @media (prefers-color-scheme: dark) { :root { --line: #444a56; --bg: #16181d; --fg: #e8e9ec; } }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 system-ui, sans-serif; }
      .layout { display: flex; max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; gap: 24px; }
      .content { flex: 1; min-width: 0; }
      .content main { max-width: 640px; margin: 0; padding: 0; }
      .content [hidden] { display: none !important; }
      #side { width: 200px; flex: none; position: sticky; top: 24px; align-self: flex-start;
        border-right: 1px solid var(--line); padding-right: 16px; }
      #side nav { display: grid; gap: 4px; }
      #side a { padding: 6px 10px; border-radius: 6px; color: inherit; text-decoration: none; }
      #side a[aria-current="true"] { background: var(--accent); color: #fff; }
      #side .brand { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700;
        margin-bottom: 12px; }
      #side .brand img { border-radius: 6px; }
      #side .report { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--line);
        display: grid; gap: 4px; }
      #side .report-note { font-size: 11px; opacity: .7; }
      h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 32px; scroll-margin-top: 16px; }
      fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 0 0 16px; }
      label { display: grid; gap: 4px; margin: 8px 0; }
      label span { font-size: 12px; opacity: .75; }
      input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
        background: transparent; color: inherit; }
      button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
        background: transparent; color: inherit; cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .row { display: flex; gap: 8px; align-items: center; }
      .errors { color: #b3261e; margin: 12px 0; padding-left: 20px; }
      .saved { color: #1e7e34; margin: 12px 0; }
      .kana-preview { margin: -4px 0 10px 2px; font-size: 12px; color: #5a6270; }
      .audit-list { display: grid; gap: 8px; margin-top: 12px; }
      .audit-list details { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
      .audit-list summary { cursor: pointer; font-size: 12px; }
      .audit-list .audit-meta { margin: 6px 0 0; font-size: 12px; }
      .audit-list details details { margin-top: 6px; }
      .audit-list pre { white-space: pre-wrap; word-break: break-all; margin: 6px 0 0; padding: 8px;
        border: 1px solid var(--line); border-radius: 6px; font-size: 12px; }
      main + main { padding-top: 32px; }
      .errors-text { color: #b3261e; }
      @media (max-width: 700px) {
        .layout { flex-direction: column; }
        #side { width: auto; position: static; border-right: none; border-bottom: 1px solid var(--line);
          padding-right: 0; padding-bottom: 12px; }
        #side nav { grid-auto-flow: column; overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div id="side" aria-label="設定メニュー"></div>
      <div class="content">
        <main id="app"></main>
        <main id="ai-app"></main>
        <main id="audit-app"></main>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
