<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="manifest.open_in_tab" content="true" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JushoAI 設定</title>
    <style>
      :root { color-scheme: light dark; --line: #c8ccd4; --accent: #2457d6; --bg: #fff; --fg: #1a1a1a; }
      @media (prefers-color-scheme: dark) { :root { --line: #444a56; --bg: #16181d; --fg: #e8e9ec; } }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 system-ui, sans-serif; }
      main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 32px; }
      fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 0 0 16px; }
      label { display: grid; gap: 4px; margin: 8px 0; }
      label span { font-size: 12px; opacity: .75; }
      input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
        background: transparent; color: inherit; }
      button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
        background: transparent; color: inherit; cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .row { display: flex; gap: 8px; align-items: center; }
      .errors { color: #b3261e; margin: 12px 0; padding-left: 20px; }
      .saved { color: #1e7e34; margin: 12px 0; }
      main + main { padding-top: 0; }
      .errors-text { color: #b3261e; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <main id="ai-app"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
