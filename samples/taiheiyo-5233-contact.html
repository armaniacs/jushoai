<!-- Minimal reproduction of https://www.taiheiyo-cement.co.jp/contact/. Values final. -->
<form>
      <label for="inquiry-category">カテゴリ必須</label>
      <select name="category" id="inquiry-category"><option value="">--</option></select>
      <label for="inquiry-title">タイトル必須</label>
      <select name="title" id="inquiry-title"><option value="">--</option></select>
      <label for="inquiry-name">お名前必須</label>
      <input name="name" id="inquiry-name" type="text" value="" placeholder="全角でお名前をご入力ください">
      <label for="inquiry-kana">ふりがな必須</label>
      <input name="kana" id="inquiry-kana" type="text" value="" placeholder="全角ひらがなでお名前をご入力ください">
      <label for="inquiry-email">メールアドレス必須</label>
      <input name="email" id="inquiry-email" type="email" value="" placeholder="メールアドレスをご入力ください">
      <label for="inquiry-email-confirm">メールアドレス（確認用）必須</label>
      <input name="emailConfirm" id="inquiry-email-confirm" type="email" value="" placeholder="確認用に再度メールアドレスをご入力ください">
      <label for="inquiry-postal">郵便番号任意</label>
      <input name="postal" id="inquiry-postal" type="text" value="" placeholder="郵便番号をご入力ください" maxlength="7">
      <label for="inquiry-address">住所任意</label>
      <input name="address" id="inquiry-address" type="text" value="" placeholder="住所をご入力ください">
      <label for="inquiry-tel">電話番号必須</label>
      <input name="tel" id="inquiry-tel" type="text" value="" placeholder="半角数字で電話番号をご入力ください" maxlength="12">
      <label for="inquiry-fax">FAX番号任意</label>
      <input name="fax" id="inquiry-fax" type="text" value="" placeholder="半角数字でFAX番号をご入力ください" maxlength="12">
      <label for="inquiry-industry">業種必須</label>
      <select name="industry" id="inquiry-industry"><option value="">--</option></select>
      <label for="inquiry-organization">所属会社・団体・学校名必須</label>
      <input name="organization" id="inquiry-organization" type="text" value="" placeholder="所属会社・団体・学校名をご入力ください">
      <label for="inquiry-department">所属部署任意</label>
      <input name="department" id="inquiry-department" type="text" value="" placeholder="所属部署をご入力ください">
      <label for="_formrun_gotcha">If you are a human, ignore this field</label>
      <input name="_formrun_gotcha" id="_formrun_gotcha" type="text" value="">
</form>
