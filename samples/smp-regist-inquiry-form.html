<!doctype html>
<!--
  Minimal reproduction of https://reg31.smp.ne.jp/regist/is?SMPFORM=qili-mbohmg-16d3b32725ef963f616238bd9d403ec2
  (SMP 資料請求フォーム).
  Field names, ids, types, maxlengths, and control kinds mirror the real page.
  The real page is Shift_JIS; the fetcher decoded the 例 placeholders as
  mojibake, so they are restored here in UTF-8 verbatim. Rows are dl/dt/dd
  and the scanner reads the dt text as nearby (the split/leftover grouping
  key), so the headings are kept verbatim (mitsui-reform-catalog-form.html
  shape). The address1 prefecture options are restored verbatim — option value
  is the name itself (forum.html shape).
-->
<html lang="ja"><meta charset="utf-8"><title>SMP 資料請求フォーム (housing)</title>
<form>
<dl>
<div><dt>お名前</dt><dd>
      <input name="name1" id="" type="text" value="" placeholder="(例：山田)">
      <input name="name2" id="" type="text" value="" placeholder="(例：太郎)">
</dd></div>
<div><dt>ふりがな</dt><dd>
      <input name="kana1" id="" type="text" value="" placeholder="(例：やまだ)">
      <input name="kana2" id="" type="text" value="" placeholder="(例：たろう)">
</dd></div>
<div><dt>郵便番号</dt><dd>
      <input name="postalCode1:a" id="" type="tel" value="" maxlength="3">
      <input name="postalCode1:t" id="" type="tel" value="" maxlength="4">
</dd></div>
<div><dt>都道府県</dt><dd>

</dd></div>
<div><dt>市区町村番地</dt><dd>
      <input name="address2" id="" type="text" value="" placeholder="(例：千葉県印西市吉田456)">
</dd></div>
<div><dt>マンション名・建物名</dt><dd>
      <input name="address3" id="" type="text" value="">
</dd></div>
<div><dt>電話番号 (ハイフンなし)</dt><dd>
      <input name="phone" id="" type="tel" value="" placeholder="(例：05031124000)" maxlength="11">
</dd></div>
<div><dt>FAX番号 (ハイフンなし)</dt><dd>
      <input name="faxnumber" id="" type="tel" value="" placeholder="(例：0476991215)" maxlength="11">
</dd></div>
<div><dt>メールアドレス</dt><dd>
      <input name="mail" id="" type="email" value="" placeholder="(例：sample@XX.co.jp)">
</dd></div>
<div><dt>メールアドレス(確認用)</dt><dd>
      <input name="mail:cf" id="" type="email" value="" placeholder="(例：sample@XX.co.jp)">
</dd></div>
</dl>
