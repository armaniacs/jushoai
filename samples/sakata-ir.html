<!-- Minimal reproduction of https://corporate.sakataseed.co.jp/inquiry/form.php?type=ir. Values final. -->
<form>
      <label for="contact-subject">件名</label>
      <input name="subject" id="contact-subject" type="text" value="" maxlength="100">
      <label for="corporate-name">法人名</label>
      <input name="corp_name" id="corporate-name" type="text" value="" placeholder="例　サカタのタネ 営業第1部、トマト生産者" maxlength="100">
      <label for="corporate-name-furigana">法人名（ふりがな）</label>
      <input name="corp_name_kana" id="corporate-name-furigana" type="text" value="" maxlength="100">
      <label for="name">お名前</label>
      <input name="name" id="name" type="text" value="" placeholder="例　山田　太郎" maxlength="50">
      <label for="name-furigana">お名前（ふりがな）</label>
      <input name="name_kana" id="name-furigana" type="text" value="" maxlength="50">
      <label for="email">メールアドレス</label>
      <input name="email" id="email" type="text" value="" placeholder="例　taro@example.com" maxlength="100">
      <label for="email-verification">メールアドレス（確認用）</label>
      <input name="email_conf" id="email-verification" type="text" value="" placeholder="例　taro@example.com" maxlength="100">
      <label for="zipcode">郵便番号</label>
      <input name="zip" id="zipcode" type="text" value="" maxlength="8">
      <label for="address-todohfuken">住所（都道府県）</label>
      <input name="add_region" id="address-todohfuken" type="text" value="" placeholder="例　神奈川県" maxlength="100">
      <label for="address-shikugun">住所（市区群）</label>
      <input name="add_locality" id="address-shikugun" type="text" value="" placeholder="例　横浜市都筑区" maxlength="100">
      <label for="address-choumeibanchi">住所（町名番地）</label>
      <input name="add_street" id="address-choumeibanchi" type="text" value="" placeholder="例　仲町台2-7-1" maxlength="100">
      <label for="phone">電話番号</label>
      <input name="tel" id="phone" type="text" value="" placeholder="例　045-945-8800、090-1234-XXXX" maxlength="40">
</form>
