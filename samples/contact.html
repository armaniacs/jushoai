<!doctype html>
<!--
  Minimal reproduction of https://www.kyutech.ac.jp/contact/
  (九州工業大学お問い合わせ).
  The real page is one table form: th headings carry the signal
  (scanner reads tr>th as nearby). name1/name2 share the お名前 label,
  kana1/kana2 share フリガナ, zip1/zip2 share 郵便番号.
  The pref_code select keeps its real 47 options verbatim (values are
  the prefecture names). The header language switcher (js_language)
  is trimmed: site chrome, not part of the contact form.
  In-scope controls: 11 (name1/2, kana1/2, zip1/2, pref_code,
  address1/2, tel, email). The rest is hidden validation state +
  one textarea + the confirm button.
-->
