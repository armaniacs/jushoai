<!doctype html>
<!--
  Minimal reproduction of https://reg34.smp.ne.jp/regist/is?SMPFORM=pfsd-lgqblb-eadedf16d2d1b0d8725c37ca6ad1a2e6
  (レーザーテック6920・SMP).
  Field names, ids, maxlengths, and control kinds mirror the real page (the
  real inputs carry no placeholders). Rows are kept as minimal tr/th/td since
  the scanner reads tr>th as nearby (lixil-inquiry-form.html 前例). The two
  selects carry the real options. inquiry textarea stays skipped per policy.
-->
<html lang="ja"><meta charset="utf-8"><title>レーザーテック お問い合わせ (SMP)</title>
<form>
<table>
<tr><th>お名前 必須</th><td><input name="seiName" id="name1" type="text" value="" maxlength="10"><input name="meiName" id="name2" type="text" value="" maxlength="10"></td></tr>
<tr><th>フリガナ 必須 ※全角カタカナで入力してください。</th><td><input name="seiNameKana" id="kana1" type="text" value="" maxlength="20"><input name="meiNameKana" id="kana2" type="text" value="" maxlength="20"></td></tr>
<tr><th>会社名・勤務先 必須 ※正式な会社名・勤務先を入力してください。</th><td><input name="company" id="comany" type="text" value="" maxlength="100"></td></tr>
<tr><th>部署 ※正式な部署名を入力してください。</th><td><input name="department" id="department" type="text" value="" maxlength="100"></td></tr>
<tr><th>役職</th><td><select name="position" id="position"><option value="">役職を選択してください</option><option value="1">経営者・役員</option><option value="2">工場長・部長</option><option value="3">課長,係長・主任</option><option value="4">教授,准教授</option><option value="5">その他</option></select></td></tr>
<tr><th>郵便番号 ※半角数字で入力してください。</th><td><input name="post:a" id="post1" type="text" value="" maxlength="3"><input name="post:t" id="post2" type="text" value="" maxlength="4"></td></tr>
<tr><th>都道府県</th><td><select name="pref" id="prefectures"><option value="">都道府県を選択してください</option><option value="北海道">北海道</option><option value="青森県">青森県</option><option value="岩手県">岩手県</option><option value="宮城県">宮城県</option><option value="秋田県">秋田県</option><option value="山形県">山形県</option><option value="福島県">福島県</option><option value="茨城県">茨城県</option><option value="栃木県">栃木県</option><option value="群馬県">群馬県</option><option value="埼玉県">埼玉県</option><option value="千葉県">千葉県</option><option value="東京都">東京都</option><option value="神奈川県">神奈川県</option><option value="新潟県">新潟県</option><option value="富山県">富山県</option><option value="石川県">石川県</option><option value="福井県">福井県</option><option value="山梨県">山梨県</option><option value="長野県">長野県</option><option value="岐阜県">岐阜県</option><option value="静岡県">静岡県</option><option value="愛知県">愛知県</option><option value="三重県">三重県</option><option value="滋賀県">滋賀県</option><option value="京都府">京都府</option><option value="大阪府">大阪府</option><option value="兵庫県">兵庫県</option><option value="奈良県">奈良県</option><option value="和歌山県">和歌山県</option><option value="鳥取県">鳥取県</option><option value="島根県">島根県</option><option value="岡山県">岡山県</option><option value="広島県">広島県</option><option value="山口県">山口県</option><option value="徳島県">徳島県</option><option value="香川県">香川県</option><option value="愛媛県">愛媛県</option><option value="高知県">高知県</option><option value="福岡県">福岡県</option><option value="佐賀県">佐賀県</option><option value="長崎県">長崎県</option><option value="熊本県">熊本県</option><option value="大分県">大分県</option><option value="宮崎県">宮崎県</option><option value="鹿児島県">鹿児島県</option><option value="沖縄県">沖縄県</option></select></td></tr>
<tr><th>市区町村</th><td><input name="address" id="municipality" type="text" value="" maxlength="100"></td></tr>
<tr><th>番地</th><td><input name="address2" id="town" type="text" value="" maxlength="100"></td></tr>
<tr><th>ビル名</th><td><input name="address3" id="building" type="text" value="" maxlength="100"></td></tr>
<tr><th>電話番号 必須 ※半角数字で入力してください。</th><td><input name="phone:a" id="tel1" type="text" value="" maxlength="5"><input name="phone:e" id="tel2" type="text" value="" maxlength="5"><input name="phone:n" id="tel3" type="text" value="" maxlength="5"></td></tr>
<tr><th>E-mailアドレス 必須 ※半角英数字で入力してください。</th><td><input name="mail" id="email" type="text" value="" maxlength="250"></td></tr>
</table>
</form>
