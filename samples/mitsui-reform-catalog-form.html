  (三井リフォーム 資料請求 入力).
  Field ids, names, placeholders, and control kinds mirror the real page. The
  real page lays its rows out as dl/dt/dd, and the scanner reads the dt text
  as nearby (grouping key for the split/leftover refine), so the headings are
  kept verbatim while the radio/checkbox/textarea rows stay skipped. pref and
  address are readonly on the real page (AjaxZip3 auto-fill, JS behavior out
  of scope); the readonly marker itself is dropped.
-->

<form>
<dl>
<div><dt>お名前</dt><dd>
      <input name="name_1" id="name_1" type="text" value="" placeholder="例）三井">
      <input name="name_2" id="name_2" type="text" value="" placeholder="例）太郎">
</dd></div>
<div><dt>フリガナ</dt><dd>
      <input name="kana_1" id="kana_1" type="text" value="" placeholder="例）ミツイ">
      <input name="kana_2" id="kana_2" type="text" value="" placeholder="例）タロウ">
</dd></div>
<div><dt>電話番号</dt><dd>
      <input name="tel" id="tel" type="tel" value="" placeholder="例）0000000000" maxlength="12">
</dd></div>
<div><dt>電話番号2</dt><dd>
      <input name="tel2" id="tel2" type="tel" value="" placeholder="例）0000000000" maxlength="12">
</dd></div>

</dd></div>
<div><dt>メールアドレス2</dt><dd>

</dd></div>
<div><dt>現在お住まいのご住所</dt><dd>
      <input name="post" id="post" type="text" value="" placeholder="例）1040061" maxlength="7">
      <input name="pref" id="pref" type="text" value="">
      <input name="address" id="address" type="text" value="">
      <input name="address2" id="address02" type="text" value="" placeholder="例）銀座6-17-1">
      <input name="address3" id="address03" type="text" value="" placeholder="例）銀座6丁⽬-SQUARE">
      <input name="address4" id="address04" type="text" value="" placeholder="例）101号室">
</dd></div>
<div><dt>ご計画建物のご住所</dt><dd>
      <input name="place_zip" id="place-post" type="text" value="" placeholder="例）1040061" maxlength="7">
      <input name="place_pref" id="place-pref" type="text" value="">

      <input name="place_address2" id="place-address02" type="text" value="" placeholder="例）銀座6-17-1">
      <input name="place_address3" id="place-address03" type="text" value="" placeholder="例）銀座6丁⽬-SQUARE">
      <input name="place_address4" id="place-address04" type="text" value="" placeholder="例）101号室">
</dd></div>
<div><dt>LOOP会員番号</dt><dd>
      <input name="loop_number" id="loop_number" type="text" value="" placeholder="例）1234567890" maxlength="10">
</dd></div>
<div><dt>お住まいのご希望エリア</dt><dd>
      <input name="purchase_area_1" id="" type="text" value="" placeholder="例）東京都世田谷区">
      <input name="purchase_area_2" id="" type="text" value="" placeholder="例）東京都世田谷区">
      <input name="purchase_area_3" id="" type="text" value="" placeholder="例）東京都世田谷区">
</dd></div>
<div><dt>ご希望の物件形態</dt><dd>
      <input name="purchase_type_other" id="" type="text" value="">
</dd></div>
<div><dt>ご予算</dt><dd>
      <input name="purchase_budget_home_b" id="" type="text" value="">
      <input name="purchase_budget_home_t" id="" type="text" value="">
      <input name="purchase_budget_reform_b" id="" type="text" value="">
      <input name="purchase_budget_reform_t" id="" type="text" value="">
</dd></div>
</dl>
