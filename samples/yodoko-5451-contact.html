<!-- Minimal reproduction of https://yodoko-official-form.spiral-site.com/contact. Values final. -->
<form>
      <label for="name">お名前</label>
      <input name="name" id="name" type="text" value="" maxlength="100">
      <label for="furiganaName">フリガナ</label>
      <input name="furiganaName" id="furiganaName" type="text" value="" maxlength="100">
      <label for="company">会社名</label>
      <input name="company" id="company" type="text" value="" maxlength="100">
      <label for="department">部署名</label>
      <input name="department" id="department" type="text" value="" maxlength="100">
      <label for="email">メールアドレス</label>
      <input name="email" id="email" type="email" value="" maxlength="256">
      <label for="confirmEmail">確認のためもう一度同じメールアドレスをご入力ください。</label>
      <input name="email:reenter" id="confirmEmail" type="email" value="" maxlength="256">
      <label for="phone">電話番号</label>
      <input name="phone" id="phone" type="text" value="" maxlength="15">
      <label for="fax">FAX番号</label>
      <input name="fax" id="fax" type="text" value="" maxlength="15">
      <label for="zip">郵便番号</label>
      <input name="zip" id="zip" type="text" value="" maxlength="7">
      <label for="prefectures">都道府県選択</label>
      <select name="prefectures" id="prefectures"><option value="">--</option></select>
      <label for="address">住所・番地</label>
      <input name="address" id="address" type="text" value="" maxlength="128">
      <label for="building">ビル・マンション</label>
      <input name="building" id="building" type="text" value="" maxlength="200">
</form>
