  (アズビル6845・きくばり資料請求).
  Field names, ids, maxlengths, and control kinds mirror the real page.
  The real page carries its questions in plain td.fm-question cells with no
  <label> association, so the scanner sees the same bare inputs as here
  (epson-ir-form.html / ricoh-vulnerability-form.html 前例). The c_q4
  prefecture select carries the real options (numeric values 0-46).
  None of the radio groups is gender/decade (all matrix/choice), so every
  radio stays skipped per policy. The c_q1/c_q2 姓/名/せい/めい inline texts
  are answer-cell spans the scanner does not read (dropped, brother 前例).
  question textarea, file inputs, checkboxes, and the hidden shims stay
  skipped per policy.
-->
