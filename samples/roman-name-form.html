<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>roman name form (joshibi-like)</title>
<form onsubmit="return false">
  <div>
    <label for="edit-name-last">①Name（最大文字数：80） ※半角英数で入力</label>
    <input type="text" id="edit-name-last" name="name_last" maxlength="80" placeholder="例：Ms. Hanako Yubin">
  </div>
  <div>
    <label>お名前 <input name="fullname" placeholder="山田　太郎"></label>
  </div>
  <div>
    <label>メールアドレス ※半角英数で入力 <input type="email" name="mail"></label>
  </div>
</form>
</html>
