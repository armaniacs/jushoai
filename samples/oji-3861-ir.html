<!-- Minimal reproduction of https://www.ojiholdings.co.jp/contact/investor/. Values final. -->
<form>
      <input name="query" id="" type="search" value="" placeholder="キーワードを入力">
      <label for="name">お名前必須</label>
      <input name="aform-field-14" id="name" type="text" value="" placeholder="例）山田太郎">
      <label for="kana">ふりがな必須</label>
      <input name="aform-field-15" id="kana" type="text" value="" placeholder="例）やまだたろう">
      <label for="occupation">職業必須</label>
      <select name="aform-field-16" id="occupation"><option value="">--</option></select>
      <label for="company_name">会社（組織）名</label>
      <input name="aform-field-17" id="company_name" type="text" value="" placeholder="例）王子ホールディングス株式会社">
      <label for="department_name">部署名</label>
      <input name="aform-field-18" id="department_name" type="text" value="" placeholder="例）営業部">
      <label for="email">Emailアドレス必須</label>
      <input name="aform-field-19" id="email" type="email" value="" placeholder="例）sample@example.co.jp">
      <label for="email-confirm">確認のためもう一度入力してください</label>
      <input name="aform-field-19-confirm" id="email-confirm" type="email" value="">
      <label for="zip">郵便番号</label>
      <input name="aform-field-20" id="zip" type="text" value="" placeholder="例）1040061">
      <label for="pref">都道府県必須</label>
      <select name="aform-field-21" id="pref"><option value="">--</option></select>
      <label for="city">市区町村・地名</label>
      <input name="aform-field-22" id="city" type="text" value="" placeholder="例）中央区銀座">
      <label for="address">番地・建物名</label>
      <input name="aform-field-23" id="address" type="text" value="" placeholder="例）４丁目７−５">
      <label for="tel">電話番号</label>
      <input name="aform-field-24" id="tel" type="tel" value="" placeholder="例）0123456789">
      <label for="fax">FAX番号</label>
      <input name="aform-field-25" id="fax" type="tel" value="" placeholder="例）0123456789">
</form>
