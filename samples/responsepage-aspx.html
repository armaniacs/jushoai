<!doctype html>
<!--
  Minimal reproduction of https://forms.cloud.microsoft/pages/responsepage.aspx?id=uyT_3okgAESMjvceaAN4sjf79RZArsplvgIJiMXnHa5UQkIwMjNaQlhTVzBFTVI3OURSQ0JPRkVLSi4u&route=shorturl
  (Tokyo OpenRoaming application, Microsoft Forms).
  The live page renders its questions client-side: a static fetch returns only
  the JS shell with none of the question texts, so the seven questions below
  are transcribed from the user report in the brief's verbatim wording.
  MS Forms renders each short-text answer as <input type="text"> labelled via
  aria-labelledby pointing at the question title (no <label> elements), so the
  fixture keeps that shape. Placeholders mirror the real page.
  Q7 stands in for the trailing questions: the report only requires that
  everything after Q6 stays unclassified, and the live wording is
  unreachable without JS rendering.
-->
<html lang="ja"><meta charset="utf-8"><title>東京都 OpenRoaming (Microsoft Forms)</title>
