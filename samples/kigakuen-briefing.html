<!doctype html>
<!--
  Minimal reproduction of https://business.form-mailer.jp/fms/08ca15c3348737
  (希学園 学校説明会お申し込みフォーム, Japanese cram school briefing).
  Field ids, names, fieldset/legend groups, and control kinds mirror the real
  page. The data-pattern="1" markers on plain text fields are form-mailer
  internals without a real pattern attribute and are dropped; the katakana
  field keeps its real pattern, and zip/tel keep their real digit patterns.
  Selects without profile-meaningful values (来場者数, 教室, 学年, きっかけ)
  keep only the empty option; the prefecture select keeps real name values.
  The date checkboxes (実施日・時間) stay skipped.
-->
