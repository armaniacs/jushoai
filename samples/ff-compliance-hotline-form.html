<!--
  Minimal reproduction of https://holdings.fujifilm.com/ja/form/compliance-hotline
  (富士フイルムHD コンプライアンス・ホットライン).
  Same Drupal form family as ff-csr.html but with no address/company/tel
  fields on the real page. 7 in-scope controls.
-->
<form>
      <label for="edit-inquiry-title">件名</label>
      <input name="inquiry_title" id="edit-inquiry-title" type="text" value="" maxlength="255">
      <label for="edit-name-first">姓</label>
      <input name="name[first]" id="edit-name-first" type="text" value="" maxlength="255">
      <label for="edit-name-last">名</label>
      <input name="name[last]" id="edit-name-last" type="text" value="" maxlength="255">
      <label for="edit-name-kana-first">セイ</label>
      <input name="name_kana[first]" id="edit-name-kana-first" type="text" value="" maxlength="255">
      <label for="edit-name-kana-last">メイ</label>
      <input name="name_kana[last]" id="edit-name-kana-last" type="text" value="" maxlength="255">
      <label for="edit-e-mailatoresu-mail-1">E-mailアドレス</label>
      <input name="e_mailatoresu[mail_1]" id="edit-e-mailatoresu-mail-1" type="email" value="" maxlength="254">
      <label for="edit-e-mailatoresu-mail-2">E-mailアドレスの確認</label>
      <input name="e_mailatoresu[mail_2]" id="edit-e-mailatoresu-mail-2" type="email" value="" maxlength="254">
</form>
