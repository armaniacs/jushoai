<!-- Minimal reproduction of https://www.trancy.co.jp/contact/. Values final. -->
<form>
      <label for="entryCompany">貴社名必須</label>
      <input name="entryCompany" id="entryCompany" type="text" value="">
      <label for="entryDept">部署名</label>
      <input name="entryDept" id="entryDept" type="text" value="">
      <label for="entryName">お名前必須</label>
      <input name="entryName" id="entryName" type="text" value="">
      <label for="entryKana">お名前（フリガナ）</label>
      <input name="entryKana" id="entryKana" type="text" value="">
      <label for="entryZip1">郵便番号</label>
      <input name="entryZip1" id="entryZip1" type="text" value="" maxlength="9">
      <label for="entryAddr">住所</label>
      <input name="entryAddr" id="entryAddr" type="text" value="">
      <label for="entryPhone">TEL必須</label>
      <input name="entryPhone" id="entryPhone" type="tel" value="" pattern="\d{2,4}-?\d{2,4}-?\d{3,4}">
      <label for="entryFax">FAX</label>
      <input name="entryFax" id="entryFax" type="tel" value="">
      <label for="entryMail1">メールアドレス必須</label>
      <input name="entryMail1" id="entryMail1" type="email" value="">
</form>
