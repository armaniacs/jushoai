<!-- Minimal reproduction of https://about.goldwin.co.jp/contact/inquiry-customer/input. Values final. -->
<form>
      <label for="email">メールアドレス</label>
      <input name="user_mail" id="email" type="email" value="">
      <label for="user_name">お客様のお名前</label>
      <input name="user_name" id="user_name" type="text" value="" maxlength="100">
      <label for="customer_user_kana">フリガナ</label>
      <input name="customer_user_kana" id="customer_user_kana" type="text" value="" maxlength="250">
      <label for="age">年齢</label>
      <select name="age" id="age"><option value="">--</option></select>
      <label for="pref_name">都道府県</label>
      <select name="pref_name" id="pref_name"><option value="">--</option></select>
      <label for="address">市区町村</label>
      <input name="address" id="address" type="text" value="" maxlength="250">
      <label for="daytime_tel">連絡先電話番号</label>
      <input name="daytime_tel" id="daytime_tel" type="tel" value="" placeholder="例）08012345678" maxlength="15" pattern="^[0-9,\uFF10-\uFF19]+$">
      <label for="customer_brand_type">ブランド名</label>
      <select name="customer_brand_type" id="customer_brand_type"><option value="">--</option></select>
      <label for="product_name">製品名</label>
      <input name="product_name" id="product_name" type="text" value="" maxlength="250">
      <label for="product_code">品番</label>
      <input name="product_code" id="product_code" type="text" value="" placeholder="例）NT81802R" maxlength="250">
      <label for="product_color">色</label>
      <input name="product_color" id="product_color" type="text" value="" maxlength="250">
      <label for="product_size">サイズ</label>
      <input name="product_size" id="product_size" type="text" value="" maxlength="250">
      <label for="purchase_store">ご購入店舗名（所有品の場合）</label>
      <input name="purchase_store" id="purchase_store" type="text" value="" maxlength="250">
      <label for="purchase_time">ご購入時期（所有品の場合）</label>
      <input name="purchase_time" id="purchase_time" type="text" value="" maxlength="250">
</form>
