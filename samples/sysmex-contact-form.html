<!doctype html>
<!--
  Minimal reproduction of https://www.sysmex.co.jp/contact/input?inquiry_type=1
  (シスメックス6869).
  Field names, labels, maxlengths, and control kinds mirror the real page
  (labels carry for-associations, so bare+label is equivalent). The pref
  select carries the real options (values 1-47). inquiry_other radios are
  IR/ニュース/その他 (not gender/decade) and stay skipped per policy.
  inquiry textarea stays skipped per policy.
-->
<html lang="ja"><meta charset="utf-8"><title>シスメックス お問い合わせ (sysmex)</title>
<form>
      <label for="inquiry_subject">お問い合わせ件名必須</label>
      <input name="inquiry_subject" id="inquiry_subject" type="text" value="" maxlength="100">
      <label for="name">お名前必須</label>
      <input name="name" id="name" type="text" value="" maxlength="100">
      <label for="name_furigana">お名前（ふりがな）必須</label>
      <input name="name_furigana" id="name_furigana" type="text" value="" maxlength="100">
      <label for="facility_company">ご施設名／会社名必須</label>
      <input name="facility_company" id="facility_company" type="text" value="" maxlength="100">
      <label for="department">所属部署名必須</label>
      <input name="department" id="department" type="text" value="" maxlength="100">
      <label for="zip">郵便番号</label>
      <input name="zip" id="zip" type="text" value="" maxlength="7">
      <label for="pref">都道府県</label>
      <select name="pref" id="pref"><option value="">都道府県を選択してください</option><option value="1">北海道</option><option value="2">青森県</option><option value="3">岩手県</option><option value="4">宮城県</option><option value="5">秋田県</option><option value="6">山形県</option><option value="7">福島県</option><option value="8">茨城県</option><option value="9">栃木県</option><option value="10">群馬県</option><option value="11">埼玉県</option><option value="12">千葉県</option><option value="13">東京都</option><option value="14">神奈川県</option><option value="15">新潟県</option><option value="16">富山県</option><option value="17">石川県</option><option value="18">福井県</option><option value="19">山梨県</option><option value="20">長野県</option><option value="21">岐阜県</option><option value="22">静岡県</option><option value="23">愛知県</option><option value="24">三重県</option><option value="25">滋賀県</option><option value="26">京都府</option><option value="27">大阪府</option><option value="28">兵庫県</option><option value="29">奈良県</option><option value="30">和歌山県</option><option value="31">鳥取県</option><option value="32">島根県</option><option value="33">岡山県</option><option value="34">広島県</option><option value="35">山口県</option><option value="36">徳島県</option><option value="37">香川県</option><option value="38">愛媛県</option><option value="39">高知県</option><option value="40">福岡県</option><option value="41">佐賀県</option><option value="42">長崎県</option><option value="43">熊本県</option><option value="44">大分県</option><option value="45">宮崎県</option><option value="46">鹿児島県</option><option value="47">沖縄県</option></select>
      <label for="city">市区町村番地</label>
      <input name="city" id="city" type="text" value="" maxlength="100">
      <label for="building">マンション・建物名</label>
      <input name="building" id="building" type="text" value="" maxlength="100">
      <label for="tel">電話番号必須</label>
      <input name="tel" id="tel" type="tel" value="" maxlength="11">
      <label for="fax">FAX番号</label>
      <input name="fax" id="fax" type="tel" value="" maxlength="11">
      <label for="email">メールアドレス必須</label>
      <input name="email" id="email" type="email" value="" maxlength="256">
<!-- skip: _csrfToken (hidden): empty-submit shim or server state, never a fill target (exclude) -->
<!-- skip: inquiry_other (hidden): empty-submit shim or server state, never a fill target (exclude) -->
<!-- skip: inquiry_other (radio): grouped as one field by name; only gender/decade groups fill (matrix etc. stay skipped) -->
<!-- skip: inquiry_other (radio): grouped as one field by name; only gender/decade groups fill (matrix etc. stay skipped) -->
<!-- skip: inquiry_other (radio): grouped as one field by name; only gender/decade groups fill (matrix etc. stay skipped) -->
