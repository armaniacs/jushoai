<!-- Minimal reproduction of https://www.jgc.com/jp/inquiries/general/input?kind=2. Values final. -->
<form>
      <label for="GeneralSubject">件名</label>
      <input name="data[General][subject]" id="GeneralSubject" type="text" value="" placeholder="例)LNGプラントについて" maxlength="255">
      <label for="GeneralName">お名前</label>
      <input name="data[General][name]" id="GeneralName" type="text" value="" placeholder="例)日揮太郎" maxlength="255">
      <label for="GeneralCompany">会社名(または個人・学生など)</label>
      <input name="data[General][company]" id="GeneralCompany" type="text" value="" placeholder="例)日揮株式会社" maxlength="255">
      <label for="GeneralDepartment">部署名</label>
      <input name="data[General][department]" id="GeneralDepartment" type="text" value="" placeholder="例)営業本部" maxlength="255">
      <label for="GeneralAddress">住所</label>
      <input name="data[General][address]" id="GeneralAddress" type="text" value="" placeholder="例)横浜市西区みなとみらい2-3-1" maxlength="255">
      <label for="GeneralTel">電話番号</label>
      <input name="data[General][tel]" id="GeneralTel" type="tel" value="" placeholder="例)0123456789" maxlength="18">
      <label for="GeneralEmail">メールアドレス</label>
      <input name="data[General][email]" id="GeneralEmail" type="text" value="" placeholder="例)nikki@co.jp" maxlength="255">
</form>
