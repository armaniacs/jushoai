<!-- Minimal reproduction of https://www.nyk.com/scripts/contact_oth_jp/index.asp. Values final. -->
<form>
      <label for="name">氏名</label>
      <input name="flname" id="name" type="text" value="" maxlength="20">
      <label for="name_kana">ふりがな</label>
      <input name="name_kana" id="name_kana" type="text" value="" maxlength="20">
      <label for="email">メールアドレス</label>
      <input name="email1" id="email" type="text" value="" maxlength="255">
      <input name="email2" id="email_confirm" type="text" value="" maxlength="255">
      <label for="tel">電話番号</label>
      <input name="tel1" id="tel" type="text" value="" maxlength="13">
      <label for="zip">郵便番号</label>
      <input name="postcode" id="zip" type="text" value="" maxlength="7">
      <label for="prefectures">都道府県</label>
      <select name="address1" id="prefectures"><option value="">--</option></select>
      <label for="address">住所</label>
      <input name="address2" id="address" type="text" value="" maxlength="120">
      <label for="age">年齢（年代）</label>
      <select name="old" id="age"><option value="">--</option></select>
      <label for="community">会社名、法人名、学校名、団体名など</label>
      <input name="community" id="community" type="text" value="" maxlength="100">
</form>
