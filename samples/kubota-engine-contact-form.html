<!doctype html>
<!--
  Minimal reproduction of https://global.engine.kubota.co.jp/ja/contact/input.php?fid=01
  (クボタ6326エンジン事業部).
  Field names, placeholders, maxlengths, and control kinds mirror the real
  page's contact form only (id=inputform1). The header/footer product-search
  forms swept in by tooling (keywords, ln/page/format/rp-min/rp-max) are
  dropped as別フォーム. Each row is kept as minimal dl/dt/dd since the
  scanner reads dd>dt as nearby (tokyu-land-kojin 前例). The two selects
  carry the real options. inquiry textarea and the nameless agree checkbox
  stay skipped per policy.
-->
<html lang="ja"><meta charset="utf-8"><title>クボタエンジン お問い合わせ (engine)</title>
<form>
<dl>
<dt>お問合せ内容</dt><dd><select name="subject" id="subject"><option value="">【選択して下さい】</option><option value="09シリーズエンジンに関するお問い合わせ">09シリーズエンジンに関するお問い合わせ</option><option value="クボタ製品の修理について">クボタ製品の修理について*</option><option value="クボタ製品の部品購入について">クボタ製品の部品購入について*</option><option value="クボタの製品を購入したい">クボタの製品を購入したい</option><option value="クボタのディーラー、販売店になりたい">クボタのディーラー、販売店になりたい</option><option value="その他">その他</option></select></dd>
<dt>お名前</dt><dd><input type="text" name="last_name" id="last_name" value="" placeholder="例）山田 タロウ"></dd>
<dt>ふりがな</dt><dd><input type="text" name="last_kana" id="last_kana" value="" placeholder="例）やまだたろう"></dd>
<dt>ご住所</dt><dd><input type="text" name="zipCode" value="" maxlength="7" placeholder="例）5568601"><select name="pref_name"><option value="">【選択して下さい】</option><option value="北海道">北海道</option><option value="青森県">青森県</option><option value="岩手県">岩手県</option><option value="秋田県">秋田県</option><option value="宮城県">宮城県</option><option value="山形県">山形県</option><option value="福島県">福島県</option><option value="栃木県">栃木県</option><option value="群馬県">群馬県</option><option value="茨城県">茨城県</option><option value="埼玉県">埼玉県</option><option value="東京都">東京都</option><option value="千葉県">千葉県</option><option value="神奈川県">神奈川県</option><option value="山梨県">山梨県</option><option value="長野県">長野県</option><option value="新潟県">新潟県</option><option value="富山県">富山県</option><option value="石川県">石川県</option><option value="福井県">福井県</option><option value="静岡県">静岡県</option><option value="岐阜県">岐阜県</option><option value="愛知県">愛知県</option><option value="三重県">三重県</option><option value="滋賀県">滋賀県</option><option value="京都府">京都府</option><option value="大阪府">大阪府</option><option value="兵庫県">兵庫県</option><option value="奈良県">奈良県</option><option value="和歌山県">和歌山県</option><option value="徳島県">徳島県</option><option value="香川県">香川県</option><option value="愛媛県">愛媛県</option><option value="高知県">高知県</option><option value="鳥取県">鳥取県</option><option value="島根県">島根県</option><option value="岡山県">岡山県</option><option value="広島県">広島県</option><option value="山口県">山口県</option><option value="福岡県">福岡県</option><option value="佐賀県">佐賀県</option><option value="長崎県">長崎県</option><option value="大分県">大分県</option><option value="熊本県">熊本県</option><option value="宮崎県">宮崎県</option><option value="鹿児島県">鹿児島県</option><option value="沖縄県">沖縄県</option></select><input type="text" name="address" value="" maxlength="100" placeholder="例）大阪市浪速区敷津東1丁目2番47号"></dd>
<dt>電話番号</dt><dd><input type="text" name="phone" value="" maxlength="13" placeholder="例）0123-45-6789"></dd>
<dt>メールアドレス</dt><dd><input type="text" name="email" id="email" value="" maxlength="100" placeholder="例）半角英数字で入力してください"></dd>
<dt>確認用メールアドレス</dt><dd><input type="text" name="email_confirm" id="email_confirm" value="" maxlength="100" placeholder="例）abc@kubota.co.jp"></dd>
<dt>会社名・所属組織名</dt><dd><input type="text" name="companyName" value="" placeholder="例）株式会社クボタ"></dd>
<dt>部署名</dt><dd><input type="text" name="department" value="" placeholder="例）○○部"></dd>
<dt>エンジンモデルナンバー</dt><dd><input type="text" name="enginemodelno" value="" placeholder="例）V3800,OC-60-E4"></dd>
<dt>エンジンシリアルナンバー</dt><dd><input type="text" name="serialno" value="" placeholder="例）V3307-8CMA001"></dd>
</dl>

<!-- skip: inquiry (textarea): not scanned (scan covers text/email/tel/search + select; exclude) -->

<!-- skip: (no name/id) (reset): unaddressable (exclude) -->
<!-- skip: subBtn (submit): action element, never a fill target (exclude) -->
</form>
