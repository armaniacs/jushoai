<!doctype html>
<!--
  Minimal reproduction of https://www.ngk.co.jp/contact/input?form_type=3
  (日本ガイシ5333・製品別窓口).
  Field names, labels, maxlengths, and control kinds mirror the real page.
  The real page shows 例 texts in p.text siblings (not labels, scanner does
  not read them) and a 住所検索 button; both are dropped as non-signals.
  inquiry textarea and agree checkbox stay skipped per policy.
-->
<html lang="ja"><meta charset="utf-8"><title>日本ガイシ お問い合わせ (insulator)</title>
<form>
      <label for="name">お名前必須</label>
      <input name="name" id="name" type="text" value="" maxlength="100">
      <label for="name-kana">ふりがな</label>
      <input name="name-kana" id="name-kana" type="text" value="" maxlength="100">
      <label for="zip">郵便番号（半角数字のみ）必須</label>
      <input name="zip" id="zip" type="text" value="" maxlength="7">
      <label for="address">ご住所必須</label>
      <input name="address" id="address" type="text" value="" maxlength="200">
      <label for="tel">電話番号（半角数字のみ）必須</label>
      <input name="tel" id="tel" type="tel" value="" maxlength="16">
      <label for="mail">メールアドレス必須</label>
      <input name="mail" id="mail" type="email" value="" maxlength="256">
      <label for="business">お勤め先必須</label>
      <input name="business" id="business" type="text" value="" maxlength="100">
      <label for="department">所属部署必須</label>
      <input name="department" id="department" type="text" value="" maxlength="100">
<!-- skip: _csrfToken (hidden): empty-submit shim or server state, never a fill target (exclude) -->
<!-- skip: (no name/id) (button): unaddressable (exclude) -->
<!-- skip: inquiry (textarea): not scanned (scan covers text/email/tel/search + select; exclude) -->
<!-- skip: agree (hidden): empty-submit shim or server state, never a fill target (exclude) -->
<!-- skip: agree (checkbox): out of scope (skip fixed) -->
<!-- skip: (no name/id) (button): unaddressable (exclude) -->
<!-- skip: _Token[fields] (hidden): empty-submit shim or server state, never a fill target (exclude) -->
<!-- skip: _Token[unlocked] (hidden): empty-submit shim or server state, never a fill target (exclude) -->
</form>
