<!-- Minimal reproduction of https://www.iino.co.jp/kaiun/contact/form/input.html. Values final. -->
<form>
      <label for="name">お名前必須</label>
      <input name="aform-field-1" id="name" type="text" value="" placeholder="例：飯野　太郎">
      <label for="furigana">お名前（ふりがな）必須</label>
      <input name="aform-field-2" id="furigana" type="text" value="" placeholder="例：いいの　たろう">
      <label for="mail">メールアドレス必須</label>
      <input name="aform-field-3" id="mail" type="email" value="" placeholder="例：user@example.com">
      <label for="mail-confirm">確認のためもう一度入力してください</label>
      <input name="aform-field-3-confirm" id="mail-confirm" type="email" value="">
      <label for="company">会社名</label>
      <input name="aform-field-4" id="company" type="text" value="" placeholder="例：飯野海運株式会社">
      <label for="company_furigana">会社名（ふりがな）</label>
      <input name="aform-field-5" id="company_furigana" type="text" value="" placeholder="例：いいのかいうんかぶしきがいしゃ">
      <label for="tel">お電話番号</label>
      <input name="aform-field-6" id="tel" type="tel" value="" placeholder="例：03-1234-5678">
      <label for="inquiry_item">お問い合わせ項目必須</label>
      <select name="aform-field-39" id="inquiry_item"><option value="">--</option></select>
</form>
