<!-- Minimal reproduction of https://www.shinetsu.co.jp/jp/inquiry/?d=shinetsu&t=ir. Values final. -->
<form>
      <label for="kana">フリガナ必須</label>
      <input name="kana" id="kana" type="text" value="" maxlength="100">
      <label for="kanji">お名前必須</label>
      <input name="kanji" id="kanji" type="text" value="" maxlength="100">
      <label for="email">E-mail必須</label>
      <input name="email" id="email" type="text" value="" maxlength="100">
      <label for="job">業種</label>
      <input name="job" id="job" type="text" value="" maxlength="100">
      <label for="company">勤務先必須</label>
      <input name="company" id="company" type="text" value="" maxlength="100">
      <label for="depart">部署名</label>
      <input name="depart" id="depart" type="text" value="" maxlength="100">
      <label for="zip1">郵便番号</label>
      <input name="zip1" id="zip1" type="text" value="" maxlength="3">
      <input name="zip2" id="zip2" type="text" value="" maxlength="4">
      <label for="pref1">住所必須</label>
      <select name="addr1" id="pref1"><option value="">--</option></select>
      <input name="addr2" id="addr2" type="text" value="" maxlength="100">
      <input name="addr3" id="addr3" type="text" value="" maxlength="100">
      <label for="tel1">電話番号必須</label>
      <input name="tel1" id="tel1" type="text" value="" maxlength="5">
      <input name="tel2" id="tel2" type="text" value="" maxlength="5">
      <input name="tel3" id="tel3" type="text" value="" maxlength="5">
      <label for="fax1">FAX番号</label>
      <input name="fax1" id="fax1" type="text" value="" maxlength="5">
      <input name="fax2" id="fax2" type="text" value="" maxlength="5">
      <input name="fax3" id="fax3" type="text" value="" maxlength="5">
</form>
