<!-- Minimal reproduction of https://www.tokyocentury.co.jp/jp/contact/other/. Values final. -->
<form>
      <label for="company">会社名</label>
      <input name="company" id="company" type="text" value="" placeholder="東京センチュリー株式会社" maxlength="100">
      <label for="department">部署名</label>
      <input name="department" id="department" type="text" value="" placeholder="広報IR部" maxlength="100">
      <label for="name">お名前</label>
      <input name="name" id="name" type="text" value="" placeholder="山田 太郎" maxlength="100">
      <label for="name_kana">フリガナ</label>
      <input name="name_kana" id="name_kana" type="text" value="" placeholder="ヤマダ タロウ" maxlength="100">
      <label for="zipcode">郵便番号</label>
      <input name="zipcode" id="zipcode" type="text" value="" placeholder="例）1010022 or 101-0022" maxlength="20">
      <label for="prefecture">都道府県</label>
      <select name="prefecture" id="prefecture"><option value="">--</option></select>
      <label for="address">市区町村番地</label>
      <input name="address" id="address" type="text" value="" placeholder="千代田区神田練塀町3 ヒューリック秋葉原タワービルディング" maxlength="100">
      <label for="phone">電話番号</label>
      <input name="phone" id="phone" type="tel" value="" placeholder="03-1234-5678 or 0312345678" maxlength="20">
      <label for="email">メールアドレス</label>
      <input name="email" id="email" type="email" value="" placeholder="example@example.com" maxlength="253">
      <label for="email_conf">確認用</label>
      <input name="email_conf" id="email_conf" type="email" value="" placeholder="example@example.com" maxlength="253">
</form>
