<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>overseas address form (joshibi-like)</title>
<form onsubmit="return false">
  <div>
    <label for="edit-name-last">①Name（最大文字数：80） ※半角英数で入力</label>
    <input type="text" id="edit-name-last" name="name_last" maxlength="80" placeholder="例：Ms. Hanako Yubin">
  </div>
  <div>
    <label for="edit-country">②Country　 ※半角英数で入力</label>
    <input type="text" id="edit-country" name="country" maxlength="80">
  </div>
  <div>
    <label for="edit-address-1">③Address-1（Building or Apartment number）（最大文字数：80） ※半角英数で入力</label>
    <input type="text" id="edit-address-1" name="address_1" maxlength="80" placeholder="例：#123 Central Apartment">
  </div>
  <div>
    <label for="edit-address-2">④Address-2（Street number, Street name）（最大文字数：80） ※半角英数で入力</label>
    <input type="text" id="edit-address-2" name="address_2" maxlength="80" placeholder="例：25-15 M.G.Peterson Ave">
  </div>
  <div>
    <label for="edit-address-3">⑤Address-3（City）（最大文字数：36） ※半角英数で入力</label>
    <input type="text" id="edit-address-3" name="address_3" maxlength="36" placeholder="例：Long Island City">
  </div>
  <div>
    <label for="edit-address-4">⑥Address-4（State/Province/Region）（最大文字数：24） ※半角英数で入力</label>
    <input type="text" id="edit-address-4" name="address_4" maxlength="24" placeholder="例：NEW YORK">
  </div>
  <div>
    <label for="edit-postal-code">⑦Postal code（最大文字数：20） ※半角英数で入力</label>
    <input type="text" id="edit-postal-code" name="postal_code" maxlength="20">
  </div>
  <div>
    <label>お名前 <input name="fullname" placeholder="山田　太郎"></label>
  </div>
</form>
</html>
