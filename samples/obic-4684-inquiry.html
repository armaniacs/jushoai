<!-- Minimal reproduction of https://www.obic.co.jp/inquiry/input. Values final. -->
<form>
      <label for="name">氏名</label>
      <input name="name" id="name" type="text" value="" placeholder="例）大比区 太郎" maxlength="50">
      <label for="kana">フリガナ</label>
      <input name="kana" id="kana" type="text" value="" placeholder="例）オービック タロウ" maxlength="50">
      <label for="company">貴社名</label>
      <input name="company" id="company" type="text" value="" placeholder="例）株式会社オービック" maxlength="50">
      <label for="section">部署名</label>
      <input name="section" id="section" type="text" value="" placeholder="例）経理部" maxlength="100">
      <label for="position">役職名</label>
      <input name="position" id="position" type="text" value="" placeholder="例）部長" maxlength="100">
      <label for="customer_other">「その他」を選択された方は、具体的な内容をこちらへ記載ください。</label>
      <input name="customer_other" id="customer_other" type="text" value="" maxlength="100">
      <label for="post">郵便番号</label>
      <input name="post" id="post" type="text" value="" placeholder="例）123-4567" maxlength="8">
      <label for="address1">住所（都道府県・市区町村・番地）</label>
      <input name="address1" id="address1" type="text" value="" placeholder="例）東京都中央区京橋2-4-15" maxlength="200">
      <label for="address2">住所（ビル名等）</label>
      <input name="address2" id="address2" type="text" value="" placeholder="例）オービックビル" maxlength="50">
      <label for="tel1">電話番号</label>
      <input name="tel1" id="tel1" type="text" value="" placeholder="例）03-1234-5678" maxlength="15">
      <label for="tel2">日中つながりやすい電話番号</label>
      <input name="tel2" id="tel2" type="text" value="" placeholder="例）03-1234-5678" maxlength="15">
      <label for="mail">メールアドレス</label>
      <input name="mail" id="mail" type="text" value="" placeholder="例）xxxxxxxxxx@obic.co.jp" maxlength="256">
      <label for="chance_newspaper">新聞</label>
      <input name="chance_newspaper" id="chance_newspaper" type="text" value="" maxlength="100">
      <label for="chance_magazine">雑誌</label>
      <input name="chance_magazine" id="chance_magazine" type="text" value="" maxlength="100">
      <label for="chance_other">その他</label>
      <input name="chance_other" id="chance_other" type="text" value="" maxlength="100">
</form>
