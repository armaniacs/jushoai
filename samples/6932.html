  (福岡大学資料請求, admission-logi 外部フォーム).
  Labels follow their inputs on the real page (floating labels); group
  headings are plain divs the scanner never reads, so only the for=
  labels are kept. school_ken/pref keep their real 48 options (numeric
  values 11-57, the +10 scheme, first option 都道府県). school is
  genuinely a single 高校選択 option (JS-populated after school_ken
  choice). birthday_y/m/d keep their real ranges (2014-1964/1-12/1-31).
  freetext is a single 高校フリー入力; the second freetext in the
  tooling scaffold came from a commented-out JS line, trimmed.
  sex (男性/女性) is a gender group, restored as real radios. stage
  (学年 12 options) and dm are not gender/decade, stay bundled skips.
  buzai[] (資料 11) and value_1[] (学部アンケート 12) are checkbox
  groups, out of scope. The form has no email field on the real page.
  In-scope controls: 16 + the sex gender pair.
-->
