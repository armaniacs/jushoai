<!doctype html>
<!--
  Minimal reproduction of the 足立学園中学校 event application form (mirai-compass
  JSF + Bootstrap). The live page renders client-side, so `make addurl` cannot
  fetch it — no target-url.md entry by design.
  Rows mirror the real page: div.form-group > div.row > span > div.col-sm-12
  whose children are the for-less label.control-label heading (with a nested
  label.label-danger 必須 badge where the page shows one), the per-field
  div.form-control-static name markers OUTSIDE the input wrappers (desktop
  hidden-xs and mobile visible-xs duplicates of the same 姓：/名：/セイ：/メイ：
  text; the 漢字 rows prefix the desktop copy with U+3000), and one wrapper div
  per input (div.col-sm-3 holding the input plus an empty div.small
  form-control-static mp0 helper). The tel row wraps each part in its own
  div.col-xs-2 col-sm-2 and puts the － separators between wrappers as
  div.form-control-static; the 生年月日 row gives each select its own wrapper.
  The two sections are h3 headings + fieldset (参加者情報入力 / 保護者等情報入力)
  with no legend, and the page has no <label for> association anywhere; the
  #textCombo combo window (placeholder 塾を検索（入力検索可）, autocomplete off)
  carries the page's only placeholder. Values are stripped, and the restored
  rows carry no value attributes: the 塾 combo visible part (textCombo + the
  empty-label form:jukuShikuchosonCd / form:jukuCd rows) and the 出身/小学校
  cascade (the label 小学校 row's form:shussinTodofukenCd with its prefecture
  options, then the empty-label form:shussinShikuchosonCd /
  form:shusshinSchoolCd rows) ride the real div.form-group rows here. The
  hidden combo parts (#combobox select, form:jukuTodofukenCd input) stay
  trimmed (isHidden territory).
-->
