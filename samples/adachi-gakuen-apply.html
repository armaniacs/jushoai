<!doctype html>
<!--
  Minimal reproduction of the 足立学園中学校 event application form (mirai-compass
  JSF + Bootstrap). The live page renders client-side, so `make addurl` cannot
  fetch it — no target-url.md entry by design.
  Rows mirror the real page: div.form-group > div.row > span > div.col-sm-12
  holding a for-less label.control-label heading (sibling of the inputs, with a
  nested label.label-danger 必須 badge where the page shows one) and one
  div.col-sm-5 whose children are the inputs and the div.form-control-static
  markers 姓：/名：/セイ：/メイ： (full-width colon) or － separators. The two
  sections are h3 headings + fieldset (参加者情報入力 / 保護者等情報入力) with
  no legend, and the page has no <label for> association, autocomplete, or
  placeholder anywhere. Values are stripped. 学年・緊急連絡先・塾コンボ and the
  出身/小学校 selects are trimmed: they pin no plan rows here (tests/corpus.ts).
-->
<html lang="ja"><meta charset="utf-8"><title>足立学園中学校 イベント申込 (school)</title>
<form id="form" name="form" class="form-horizontal">
  <h3>参加者情報入力</h3>
  <fieldset>
    <div class="form-group">
      <div class="row"><span class=""><div class="col-sm-12"><label class="col-xs-12 col-sm-3 col-md-3 control-label">児童氏名(漢字)&nbsp;<label class="label label-danger">必須</label></label>
        <div class="col-sm-5">
          <div class="small form-control-static">姓：</div>
          <input id="form:SSeiKanji" name="form:SSeiKanji" type="text" class="form-control input-sm" maxlength="50">
          <div class="small form-control-static">名：</div>
          <input id="form:SMeiKanji" name="form:SMeiKanji" type="text" class="form-control input-sm" maxlength="50">
        </div></div></span></div>
    </div>
    <div class="form-group">
      <div class="row"><span class=""><div class="col-sm-12"><label class="col-xs-12 col-sm-3 col-md-3 control-label">児童氏名(カナ)&nbsp;<label class="label label-danger">必須</label></label>
        <div class="col-sm-5">
          <div class="small form-control-static">セイ：</div>
          <input id="form:SSeiKana" name="form:SSeiKana" type="text" class="form-control input-sm" maxlength="50">
          <div class="small form-control-static">メイ：</div>
          <input id="form:j_idt138" name="form:j_idt138" type="text" class="form-control input-sm" maxlength="50">
        </div></div></span></div>
    </div>
    <div class="form-group">
      <div class="row"><span class=""><div class="col-sm-12"><label class="col-xs-12 col-sm-3 col-md-3 control-label">生年月日&nbsp;<label class="label label-danger">必須</label></label>
        <div class="col-sm-5">
          <select id="form:j_idt253" name="form:j_idt253" class="form-control input-sm"><option value="">年</option><option value="2014">2014年</option></select>
          <select id="form:j_idt257" name="form:j_idt257" class="form-control input-sm"><option value="">月</option><option value="5">5月</option><option value="11">11月</option></select>
          <select id="form:j_idt261" name="form:j_idt261" class="form-control input-sm"><option value="">日</option><option value="7">7日</option><option value="11">11日</option></select>
        </div></div></span></div>
    </div>
    <div class="form-group">
      <div class="row"><span class=""><div class="col-sm-12"><label class="col-xs-12 col-sm-3 col-md-3 control-label">郵便番号&nbsp;<label class="label label-danger">必須</label></label>
        <div class="col-sm-5">
          <input id="form:zipCodeJukensha" name="form:zipCodeJukensha" type="text" class="form-control input-sm" maxlength="7">
        </div></div></span></div>
    </div>
    <div class="form-group">
      <div class="row"><span class=""><div class="col-sm-12"><label class="col-xs-12 col-sm-3 col-md-3 control-label">都道府県&nbsp;<label class="label label-danger">必須</label></label>
        <div class="col-sm-5">
          <select id="form:tfknJukensha" name="form:tfknJukensha" class="form-control input-sm"><option value="">選んでください</option><option value="東京都">東京都</option><option value="大阪府">大阪府</option></select>
        </div></div></span></div>
    </div>
    <div class="form-group">
      <div class="row"><span class=""><div class="col-sm-12"><label class="col-xs-12 col-sm-3 col-md-3 control-label">市区町村&nbsp;<label class="label label-danger">必須</label></label>
        <div class="col-sm-5">
          <input id="form:j_idt335" name="form:j_idt335" type="text" class="form-control input-sm" maxlength="60">
        </div></div></span></div>
    </div>
    <div class="form-group">
      <div class="row"><span class=""><div class="col-sm-12"><label class="col-xs-12 col-sm-3 col-md-3 control-label">町名・番地&nbsp;<label class="label label-danger">必須</label></label>
        <div class="col-sm-5">
          <input id="form:j_idt353" name="form:j_idt353" type="text" class="form-control input-sm" maxlength="60">
        </div></div></span></div>
    </div>
    <div class="form-group">
      <div class="row"><span class=""><div class="col-sm-12"><label class="col-xs-12 col-sm-3 col-md-3 control-label">建物名・部屋番号</label>
        <div class="col-sm-5">
          <input id="form:j_idt371" name="form:j_idt371" type="text" class="form-control input-sm" maxlength="60">
        </div></div></span></div>
    </div>
    <div class="form-group">
      <div class="row"><span class=""><div class="col-sm-12"><label class="col-xs-12 col-sm-3 col-md-3 control-label">電話番号&nbsp;<label class="label label-danger">必須</label></label>
        <div class="col-sm-5">
          <input id="form:j_idt503" name="form:j_idt503" type="text" class="form-control input-sm" maxlength="5">
          <div class="small form-control-static">－</div>
          <input id="form:j_idt507" name="form:j_idt507" type="text" class="form-control input-sm" maxlength="4">
          <div class="small form-control-static">－</div>
          <input id="form:j_idt511" name="form:j_idt511" type="text" class="form-control input-sm" maxlength="4">
        </div></div></span></div>
    </div>
    <div class="form-group">
      <div class="row"><span class=""><div class="col-sm-12"><label class="col-xs-12 col-sm-3 col-md-3 control-label">メールアドレス&nbsp;<label class="label label-danger">必須</label></label>
        <div class="col-sm-5">
          <input id="form:j_idt589" name="form:j_idt589" type="text" class="form-control input-sm" maxlength="256">
        </div></div></span></div>
    </div>
  </fieldset>
  <h3>保護者等情報入力</h3>
  <fieldset>
    <div class="form-group">
      <div class="row"><span class=""><div class="col-sm-12"><label class="col-xs-12 col-sm-3 col-md-3 control-label">保護者氏名(漢字)&nbsp;<label class="label label-danger">必須</label></label>
        <div class="col-sm-5">
          <div class="small form-control-static">姓：</div>
          <input id="form:j_idt1718" name="form:j_idt1718" type="text" class="form-control input-sm" maxlength="50">
          <div class="small form-control-static">名：</div>
          <input id="form:j_idt1726" name="form:j_idt1726" type="text" class="form-control input-sm" maxlength="50">
        </div></div></span></div>
    </div>
    <div class="form-group">
      <div class="row"><span class=""><div class="col-sm-12"><label class="col-xs-12 col-sm-3 col-md-3 control-label">保護者氏名(カナ)&nbsp;<label class="label label-danger">必須</label></label>
        <div class="col-sm-5">
          <div class="small form-control-static">セイ：</div>
          <input id="form:j_idt1748" name="form:j_idt1748" type="text" class="form-control input-sm" maxlength="50">
          <div class="small form-control-static">メイ：</div>
          <input id="form:j_idt1756" name="form:j_idt1756" type="text" class="form-control input-sm" maxlength="50">
        </div></div></span></div>
    </div>
  </fieldset>
</form>
</html>
