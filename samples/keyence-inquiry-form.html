  (キーエンス6861).
  Field names, labels, placeholders, maxlengths, and control kinds mirror the
  real multi-step inquiry form. checkRegistered is the first-screen email gate
  and stays in scope; the signin-screen loginUserName is a member-login path
  (別フロー) and is dropped (kubota search-form 前例). The nameless
  js-bookmark-dialog-catalog select lives in a <template> catalog-download
  dialog outside the form (options are JS-filled) and is dropped as 別UI.
  The three selects carry the real options (enq0 texts were numeric character
  references on the real page, decoded to UTF-8; aeon 前例). None of the enq
  radio/checkbox groups is gender/decade, so every group stays skipped.
-->
