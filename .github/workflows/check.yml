name: Check

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'pbi/**'

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate WXT types
        # make check's typecheck runs wxt prepare too; this explicit step is
        # defensive so the generated types exist before typecheck even if the
        # Makefile changes. It must stay after the dependency install, or npx
        # would fetch wxt from the registry.
        run: npx wxt prepare

      - name: Typecheck, test and build
        run: make check
