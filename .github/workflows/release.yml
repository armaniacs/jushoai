name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate WXT types
        # postinstall (wxt prepare) is skipped by --ignore-scripts, so the
        # generated types the build and typecheck need are created explicitly.
        run: npx wxt prepare

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi

      - name: Typecheck, test and build
        run: make check

      - name: Package
        run: |
          make zip
          make zip-firefox

      - name: Submit to stores
        # wxt submit は publish-extension の別名で、CHROME_*/EDGE_*/FIREFOX_*
        # の env が揃ったストアに提出する。ZIP 系の env が無いストアは対象外になる。
        # 3ストアは Promise.allSettled で並行提出されるため、1件の失敗が他を止めない。
        # Release 作成より前に置く: 提出失敗時に半端な Release を残さないため。
        # Chrome は API v2＋サービスアカウントを使う。組織ポリシー
        # （iam.disableServiceAccountKeyCreation）はプロジェクト jushoai-store
        # に限ってオーバーライドで無効化済みのため鍵作成が可能。
        # API v1.1＋OAuth は 2026-10-15 で Google が停止するため使用しない。
        run: |
          version="$(node -p "require('./package.json').version")"
          CHROME_ZIP="dist/jushoai-${version}-chrome.zip" \
          EDGE_ZIP="dist/jushoai-${version}-chrome.zip" \
          FIREFOX_ZIP="dist/jushoai-${version}-firefox.zip" \
          FIREFOX_SOURCES_ZIP="dist/jushoai-${version}-sources.zip" \
          npx wxt submit
        env:
          CHROME_API_VERSION: "v2"
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          FIREFOX_CHANNEL: "listed"
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      - name: Extract release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/jushoai-${version}-chrome.zip" \
            "dist/jushoai-${version}-firefox.zip" \
            "dist/jushoai-${version}-sources.zip" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
