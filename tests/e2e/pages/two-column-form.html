<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>two column form</title>
<style>
  /* Dense two-column layout like the reported bug (2026-10-27): a banner
     anchored to the right of the 姓 column used to cover the 名 column. The
     heading leaves room above, so the placement has a clear candidate to
     move to (a no-spot form is the translucency fallback's case, PBI-162). */
  body { margin: 16px; font-family: system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 48px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; max-width: 520px; }
  label { display: block; font-size: 12px; margin-bottom: 2px; }
  input, select { width: 100%; box-sizing: border-box; }
</style>
<h1>登録フォーム</h1>
<form onsubmit="return false">
  <div><label for="ln">姓</label><input id="ln" name="lastName"></div>
  <div><label for="fn">名</label><input id="fn" name="firstName"></div>
  <div><label for="lk">セイ</label><input id="lk" placeholder="ヤマダ"></div>
  <div><label for="fk">メイ</label><input id="fk" placeholder="ﾀﾛｳ"></div>
  <div><label for="zip">郵便番号</label><input id="zip" placeholder="123-4567"></div>
  <div><label for="pref">都道府県</label>
    <select id="pref"><option value="">--</option><option value="13">東京都</option><option value="27">大阪府</option></select></div>
  <div><label for="em">メールアドレス</label><input id="em" type="email"></div>
  <div><label for="tel">電話番号</label><input id="tel" type="tel" placeholder="09012345678"></div>
</form>
</html>
